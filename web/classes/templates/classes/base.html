<!doctype html>
{% load static %}

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Default Title{% endblock %}</title>
        {% csrf_token %}  <!-- Add this line -->
        <link rel="icon" href="/favicon.ico?v=3" type="image/x-icon">
        <link rel="shortcut icon" href="/favicon.ico?v=3" type="image/x-icon">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32x32.png' %}?v=2">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon-16x16.png' %}?v=2">
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}?v=2">
        <link rel="manifest" href="{% static 'icons/site.webmanifest' %}?v=2">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://unpkg.com/htmx.org@2.0.2"></script>
        <link rel="stylesheet" href="{% static 'css/base.css' %}">
        {% block style %}{% endblock %}
    </head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <nav class="navbar app-navbar" data-bs-theme="dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-3" href="{% url 'schedule' %}">
                <img class="app-brand-icon"
                     src="{% static 'icons/android-chrome-192x192.png' %}"
                     alt="Crimson Scheduler">
                <span class="app-brand-title">Crimson Scheduler</span>
            </a>
            <div class="app-nav-actions">
                <button type="button" class="nav-action" aria-label="Help">? <span>Help</span></button>
                <div class="dropdown">
                    <button type="button"
                            class="nav-action dropdown-toggle"
                            id="optionsMenuButton"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            aria-label="Options">
                        <span>Options</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end options-menu" aria-labelledby="optionsMenuButton">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="timeFormatToggle">
                            <label class="form-check-label" for="timeFormatToggle">24-Hour Time</label>
                        </div>
                        <div class="form-check mt-2 weekend-option">
                            <input class="form-check-input" type="checkbox" id="hideWeekendsToggle">
                            <label class="form-check-label" for="hideWeekendsToggle">Hide Weekends</label>
                        </div>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="showInstructorToggle">
                            <label class="form-check-label" for="showInstructorToggle">Show Instructors</label>
                        </div>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="showSectionToggle">
                            <label class="form-check-label" for="showSectionToggle">Show Section</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div id="content" name="content">
    {% block content %}

    {% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>




</html>
