<!doctype html>
{% load static %}

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Default Title{% endblock %}</title>
        {% csrf_token %}  <!-- Add this line -->
        <link rel="icon" href="/favicon.ico?v=3" type="image/x-icon">
        <link rel="shortcut icon" href="/favicon.ico?v=3" type="image/x-icon">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32x32.png' %}?v=2">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon-16x16.png' %}?v=2">
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}?v=2">
        <link rel="manifest" href="{% static 'icons/site.webmanifest' %}?v=2">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://unpkg.com/htmx.org@2.0.2"></script>
        {% block style %}{% endblock %}
        <style>
            :root {
                --wsu-crimson: #981e32;
                --wsu-crimson-dark: #7f1425;
            }
            body {
                margin: 0;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f7f8fa;
                color: #111827;
            }
            .app-navbar {
                background: linear-gradient(180deg, var(--wsu-crimson) 0%, var(--wsu-crimson-dark) 100%);
                min-height: 74px;
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset;
            }
            .app-brand-title {
                color: #fff;
                font-size: 1.72rem;
                font-weight: 800;
                letter-spacing: 0;
                text-transform: uppercase;
            }
            .app-brand-icon {
                border-radius: 8px;
                height: 46px;
                width: 46px;
            }
            .app-nav-actions {
                align-items: center;
                display: flex;
                gap: 18px;
            }
            .nav-action {
                align-items: center;
                background: transparent;
                border: 0;
                color: #fff;
                display: inline-flex;
                font-weight: 700;
                gap: 8px;
                padding: 8px 0;
            }
            .options-menu {
                --bs-dropdown-bg: #fff;
                --bs-dropdown-color: #111827;
                --bs-dropdown-link-color: #111827;
                border: 0;
                border-radius: 6px;
                background: #fff;
                color: #111827;
                box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
                min-width: 190px;
                padding: 10px 12px;
            }
            .options-menu .form-check-input {
                background-color: #fff;
                border-color: #6b7280;
            }
            .options-menu .form-check-input:checked {
                background-color: var(--wsu-crimson);
                border-color: var(--wsu-crimson);
            }
            .options-menu .form-check-label {
                color: #111827;
                font-weight: 700;
            }
            .htmx-indicator {
                display: none;
                margin: 10px 0;
            }
            .htmx-request .htmx-indicator {
                display: block;
            }
            .htmx-request.htmx-indicator {
                display: block;
            }
        </style>
    </head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <nav class="navbar app-navbar" data-bs-theme="dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-3" href="{% url 'schedule' %}">
                <img class="app-brand-icon"
                     src="{% static 'icons/android-chrome-192x192.png' %}"
                     alt="Crimson Scheduler">
                <span class="app-brand-title">Crimson Scheduler</span>
            </a>
            <div class="app-nav-actions">
                <button type="button" class="nav-action" aria-label="Help">? <span>Help</span></button>
                <div class="dropdown">
                    <button type="button"
                            class="nav-action dropdown-toggle"
                            id="optionsMenuButton"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            aria-label="Options">
                        o <span>Options</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end options-menu" aria-labelledby="optionsMenuButton">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="timeFormatToggle">
                            <label class="form-check-label" for="timeFormatToggle">24-Hour Time</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div id="content", name="content">
    {% block content %}

    {% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>




</html>
