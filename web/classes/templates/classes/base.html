<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Default Title{% endblock %}</title>
        {% csrf_token %}  <!-- Add this line -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://unpkg.com/htmx.org@2.0.2"></script>
        {% block style %}{% endblock %}
        <style>
            .htmx-indicator {
                display: none;
                margin: 10px 0;
            }
            .htmx-request .htmx-indicator {
                display: block;
            }
            .htmx-request.htmx-indicator {
                display: block;
            }
        </style>
    </head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <nav class="navbar" style="background-color: #c74747;" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/0/07/Washington_State_Cougars_logo.svg/1920px-Washington_State_Cougars_logo.svg.png" 
                     alt="Logo" 
                     width="50" 
                     height="50" 
                     class="me-2">
                <span class="fs-2"><strong>WSU Schedule Builder</strong></span>
            </a>
        </div>
    </nav>
    <div id="content", name="content">
    {% block content %}

    {% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>




</html>
