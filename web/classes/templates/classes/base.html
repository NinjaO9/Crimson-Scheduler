<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Default Title{% endblock %}</title>
        {% csrf_token %}  <!-- Add this line -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://unpkg.com/htmx.org@2.0.2"></script>
        {% block style %}{% endblock %}
        <style>
            :root {
                --wsu-crimson: #981e32;
                --wsu-crimson-dark: #7f1425;
            }
            body {
                margin: 0;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f7f8fa;
                color: #111827;
            }
            .app-navbar {
                background: linear-gradient(180deg, var(--wsu-crimson) 0%, var(--wsu-crimson-dark) 100%);
                min-height: 74px;
                box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset;
            }
            .app-brand-title {
                color: #fff;
                font-size: 1.72rem;
                font-weight: 800;
                letter-spacing: 0;
                text-transform: uppercase;
            }
            .app-nav-actions {
                align-items: center;
                display: flex;
                gap: 18px;
            }
            .nav-action {
                align-items: center;
                background: transparent;
                border: 0;
                color: #fff;
                display: inline-flex;
                font-weight: 700;
                gap: 8px;
                padding: 8px 0;
            }
            .htmx-indicator {
                display: none;
                margin: 10px 0;
            }
            .htmx-request .htmx-indicator {
                display: block;
            }
            .htmx-request.htmx-indicator {
                display: block;
            }
        </style>
    </head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <nav class="navbar app-navbar" data-bs-theme="dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-3" href="{% url 'schedule' %}">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/0/07/Washington_State_Cougars_logo.svg/1920px-Washington_State_Cougars_logo.svg.png" 
                     alt="Logo" 
                     width="46" 
                     height="46">
                <span class="app-brand-title">WSU Schedule Builder</span>
            </a>
            <div class="app-nav-actions">
                <button type="button" class="nav-action" aria-label="Help">? <span>Help</span></button>
                <button type="button" class="nav-action" aria-label="My Schedule">o <span>My Schedule</span>v</button>
            </div>
        </div>
    </nav>
    <div id="content", name="content">
    {% block content %}

    {% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>




</html>
