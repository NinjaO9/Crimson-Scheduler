<h3>Select a Course</h3>
<div class="list-group">
  {% for course in courses %}
    <button
      class="list-group-item list-group-item-action"
      hx-get="{% url 'load_sections' course.id %}"
      hx-target="#content"
      hx-swap="innerHTML">
      {{ course.name }}
    </button>
    
    <!-- <li> {{course.name}} </li> -->
  {% endfor %}
</div>
