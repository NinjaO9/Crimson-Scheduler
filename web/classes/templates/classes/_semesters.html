<h3>Select a Semester</h3>
<div class="list-group">
  {% for semester in semesters %}
    <button
      class="list-group-item list-group-item-action"
      hx-get="{% url 'load_topics' semester.id %}"
      hx-target="#content"
      hx-swap="innerHTML">
      {{ semester.name }}
    </button>
  {% endfor %}
</div>
