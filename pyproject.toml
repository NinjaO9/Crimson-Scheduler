[project]
name = "crimson-scheduler"
version = "0.1.0"
description = "A WSU-focused course schedule builder."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.7",
    "psycopg[binary]==3.2.10",
    "PySocks==1.7.1",
    "python-dotenv==1.1.1",
    "redis==8.1.0",
    "requests==2.32.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "venv",
    "web/staticfiles",
    "_generated_site",
    "web/classes/migrations",
]

[tool.ruff.lint]
# E9 covers syntax/compile errors; the remaining groups catch correctness,
# import-order, bug-pattern, and Python-upgrade issues without enforcing a
# project-wide style rewrite during this tooling milestone.
select = ["E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
line-ending = "auto"
