name: Update Course API

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */1 * * *"

concurrency:
  group: update-course-api
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-course-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate course JSON
        run: |
          python -m dataCollection.dataHandler.generate_json
          touch _generated_site/.nojekyll

      - name: Publish to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: crimson-data
          folder: _generated_site
          clean: true
          single-commit: true
          commit-message: "Update generated course API"
