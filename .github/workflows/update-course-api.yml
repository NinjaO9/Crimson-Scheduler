name: Update Course API

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */1 * * *"

concurrency:
  # Course catalog and course-specific metadata publish to the same branch.
  # Serialize both workflows so they cannot rebase/push over one another.
  group: crimson-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-course-api:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BYPASS_APP_ID }}
          private-key: ${{ secrets.BYPASS_APP_PRIVATE_KEY }}

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate course JSON
        run: |
          python -m dataCollection.dataHandler.generate_json
          touch _generated_site/.nojekyll

      - name: Publish to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: crimson-data
          folder: _generated_site
          # Keep the independently managed course-specific metadata folder.
          clean-exclude: |
            api/v1/specifics/**
          clean: true
          # Multiple workflows publish to this branch; preserve existing
          # history so the action can rebase instead of replacing the branch.
          force: false
          attempt-limit: 5
          commit-message: "Update generated course API"
